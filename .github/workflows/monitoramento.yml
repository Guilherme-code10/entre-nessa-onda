name: Monitorar disponibilidade do MVP

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    name: Verificar acesso publico HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar status HTTP e conteudo da pagina
        shell: bash
        run: |
          set -euo pipefail
          URL="https://guilherme-code10.github.io/entre-nessa-onda/"
          echo "Verificando disponibilidade em: $URL"
          HTML="$(mktemp)"
          HTTP_CODE="$(curl --location --silent --show-error --output "$HTML" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 35 "$URL")"
          echo "Codigo HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::DOWN: site retornou HTTP $HTTP_CODE"
            exit 1
          fi
          if ! grep -q "Entre Nessa Onda" "$HTML"; then
            echo "::error::DOWN: conteudo da aplicacao nao foi encontrado"
            exit 1
          fi
          echo "UP: HTTP 200 e identificacao da aplicacao confirmada."
